# xlink 全栈编排：达人后端 + 会议 AI + 飞书 + 智能体 + 门户前端
# 用法：
#   cp docker/.env.example docker/.env   # 按需修改密钥与各 API Key
#   docker compose --env-file docker/.env up -d --build
#
# 仅启动后端（不含前端）：
#   docker compose --env-file docker/.env up -d --build mysql redis influencer-backend meeting-ai flybook qdrant xlink-agent

name: xlink

services:
  mysql:
    image: mysql:8.0
    container_name: xlink_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: influencer_db
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Information_Aggregation/scripts/init.sql:/docker-entrypoint-initdb.d/01-influencer.sql:ro
      - ./docker/mysql/02-meeting-ai.sql:/docker-entrypoint-initdb.d/02-meeting-ai.sql:ro
      - ./docker/mysql/04-xlink-agent.sql:/docker-entrypoint-initdb.d/04-xlink-agent.sql:ro
      - ./docker/mysql/03-grants.sql:/docker-entrypoint-initdb.d/03-grants.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: xlink_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  influencer-backend:
    build:
      context: ./Information_Aggregation/backend
      dockerfile: Dockerfile
    image: xlink/influencer-backend:latest
    container_name: xlink_influencer_backend
    restart: unless-stopped
    env_file:
      - ./Information_Aggregation/backend/.env
    ports:
      - "${INFLUENCER_API_PORT:-8000}:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-app_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app123}
      DB_NAME: influencer_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${JWT_SECRET:-dev-local-secret-key-at-least-32-characters-long}
      DEBUG: ${DEBUG:-false}
      PLAYWRIGHT_HEADLESS: "true"
      API_HOST: 0.0.0.0
      API_PORT: 8000
      FLYBOOK_API_URL: http://flybook:8002
      MEETING_AI_API_URL: http://meeting-ai:8001
      PORTAL_INTERNAL_KEY: ${PORTAL_INTERNAL_KEY:-dev-flybook-internal-key-change-me}
      FLYBOOK_INTERNAL_KEY: ${PORTAL_INTERNAL_KEY:-dev-flybook-internal-key-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - ./Information_Aggregation/backend/logs:/app/logs
      - influencer_cookies:/app/cookies
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  meeting-ai:
    build:
      context: ./meeting_ai
      dockerfile: Dockerfile
    image: xlink/meeting-ai:latest
    container_name: xlink_meeting_ai
    restart: unless-stopped
    env_file:
      - ./meeting_ai/.env
    ports:
      - "${MEETING_API_PORT:-8001}:8001"
    environment:
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-dev-local-secret-key-at-least-32-characters-long}
      PORTAL_API_URL: http://influencer-backend:8000
      PORTAL_INTERNAL_KEY: ${PORTAL_INTERNAL_KEY:-dev-flybook-internal-key-change-me}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-app_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app123}
      DB_NAME: meeting_ai
      FFMPEG_PATH: /usr/bin
    volumes:
      - meeting_upload:/app/upload
      - meeting_output:/app/output
      - ./meeting_ai/logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      influencer-backend:
        condition: service_started

  flybook:
    build:
      context: ./flybook
      dockerfile: Dockerfile
    image: xlink/flybook:latest
    container_name: xlink_flybook
    restart: unless-stopped
    env_file:
      - ./flybook/.env
    ports:
      - "${FLYBOOK_API_PORT:-8002}:8002"
    environment:
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-dev-local-secret-key-at-least-32-characters-long}
      PORTAL_API_URL: http://influencer-backend:8000
      FLYBOOK_INTERNAL_KEY: ${PORTAL_INTERNAL_KEY:-dev-flybook-internal-key-change-me}
    volumes:
      - ./flybook/logs:/app/logs
    depends_on:
      influencer-backend:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: xlink_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  xlink-agent:
    build:
      context: ./xlink_agent/backend
      dockerfile: Dockerfile
    image: xlink/xlink-agent:latest
    container_name: xlink_agent
    restart: unless-stopped
    env_file:
      - ./xlink_agent/backend/.env
    ports:
      - "${AGENT_API_PORT:-8003}:8003"
    environment:
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-dev-local-secret-key-at-least-32-characters-long}
      PORTAL_API_URL: http://influencer-backend:8000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-app_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app123}
      DB_NAME: xlink_agent
      QDRANT_MODE: url
      QDRANT_URL: http://qdrant:6333
      WORKSPACE_ROOT: /data/workspaces
      BROWSER_HEADLESS: "true"
    volumes:
      - ./xlink_agent/backend/logs:/app/logs
      - agent_workspace:/data/workspaces
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
      influencer-backend:
        condition: service_started

  portal-frontend:
    build:
      context: ./Information_Aggregation/frontend
      dockerfile: Dockerfile
    image: xlink/portal-frontend:latest
    container_name: xlink_portal_frontend
    restart: unless-stopped
    ports:
      - "${PORTAL_HTTP_PORT:-80}:80"
    environment:
      INFLUENCER_API_HOST: influencer-backend:8000
      MEETING_API_HOST: meeting-ai:8001
      FLYBOOK_API_HOST: flybook:8002
      AGENT_API_HOST: xlink-agent:8003
    depends_on:
      - influencer-backend
      - meeting-ai
      - flybook
      - xlink-agent

volumes:
  mysql_data:
  influencer_cookies:
  meeting_upload:
  meeting_output:
  qdrant_data:
  agent_workspace:
